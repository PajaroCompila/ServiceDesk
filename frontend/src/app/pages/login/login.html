<main class="login-page">
  <header class="login-header">
    <div class="login-brand">
      <img src="/images/brand/pajaro-azul.png" alt="Almacén Pájaro Azul" width="753" height="66" />
      <span>ServiceDesk</span>
    </div>
    <app-theme-toggle />
  </header>
  <section class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Login</h1>

    <form (submit)="onSubmit($event)" novalidate autocomplete="off">
      <div class="login-fields">
        <div class="input-field">
          <label class="visually-hidden" for="username">Usuario</label>
          <input
            id="username"
            name="username"
            type="text"
            placeholder="Usuario"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
          />
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.42 0-8 2.24-8 5v2h16v-2c0-2.76-3.58-5-8-5Z"
            />
          </svg>
        </div>

        <div class="input-field">
          <label class="visually-hidden" for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Contraseña"
            autocomplete="off"
          />
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M18 10h-1V7A5 5 0 0 0 7 7v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2ZM9 7a3 3 0 0 1 6 0v3H9V7Zm4 10.73V19h-2v-1.27a2 2 0 1 1 2 0Z"
            />
          </svg>
        </div>
      </div>

      <div class="login-options">
        <label class="remember-me">
          <input type="checkbox" name="remember" />
          <span>Recuérdame</span>
        </label>
        <button class="text-button" type="button" disabled>¿Olvidaste tu contraseña?</button>
      </div>

      <button class="login-button" type="submit">Iniciar sesión</button>

      <p class="register-prompt">
        ¿No tienes una cuenta?
        <button class="text-button" type="button" disabled>Regístrate</button>
      </p>
    </form>
  </section>
</main>
