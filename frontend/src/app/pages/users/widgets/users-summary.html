<section class="summary-grid" aria-label="Resumen del directorio">
  <article>
    <span class="summary-icon"><i class="pi pi-users" aria-hidden="true"></i></span>
    <div>
      <span>Personas en el directorio</span><strong>{{ total() }} <small>usuarios</small></strong>
    </div>
  </article>
  <article>
    <span class="summary-icon positive"><i class="pi pi-user-plus" aria-hidden="true"></i></span>
    <div>
      <span>Usuarios activos</span><strong>{{ active() }} <small>activos</small></strong>
    </div>
  </article>
  <article>
    <span class="summary-icon violet"><i class="pi pi-envelope" aria-hidden="true"></i></span>
    <div>
      <span>Buzones compartidos</span><strong>{{ shared() }} <small>correos</small></strong>
    </div>
  </article>
</section>
